# Segredos de exemplo para uso LOCAL (Minikube/Kind). Nunca commite valores
# reais de producao num arquivo como este - use um cofre externo (Vault,
# AWS Secrets Manager, etc.) ou pelo menos um values.yaml fora do git.
apiVersion: v1
kind: Secret
metadata:
  name: produto-service-secrets
  namespace: produto-service
type: Opaque
stringData:
  DB_PASSWORD: "root"
  MYSQL_ROOT_PASSWORD: "root"
  RABBIT_PASSWORD: "guest"
  JWT_SECRET: "k8s-local-secret-troque-em-producao-32ch"

server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:produto_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.rabbitmq.host=${RABBIT_HOST:rabbitmq}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

app.security.jwt.secret=${JWT_SECRET:my-super-secret-key-my-super-secret-key}

# O docker-compose.yml deste repo nao sobe eureka-server/gateway/auth-service
# (cada um vive no proprio repositorio). Desabilitado por padrao pra nao ficar
# tentando registrar em algo que nao existe; habilite com EUREKA_ENABLED=true
# se conectar este container na mesma rede dos outros servicos.
eureka.client.enabled=${EUREKA_ENABLED:false}

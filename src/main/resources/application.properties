spring.application.name=produto-service
spring.profiles.default=dev

spring.jpa.open-in-view=false

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=produto-service
management.health.rabbit.enabled=true
management.info.env.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.api.pagination.default-size=20
app.api.pagination.max-size=100
# Mesmo valor default do auth-service (jwt.secret) e do api_gateway
# (security.jwt.secret) - os tres precisam usar o mesmo segredo HMAC pra
# validar os tokens emitidos pelo auth-service. Sobrescreva via JWT_SECRET
# nos tres servicos com o mesmo valor em ambientes reais.
app.security.jwt.secret=${JWT_SECRET:my-super-secret-key-my-super-secret-key}
app.outbox.retry-delay-ms=30000
app.outbox.auto-publish=true
app.outbox.max-tentativas=5

# Eureka Server exige HTTP Basic em todas as chamadas (inclusive registro),
# por isso as credenciais vao embutidas na URL.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://admin:123456@localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# O api_gateway roteia /api/product/** para lb://PRODUCT-SERVICE - o nome de
# registro precisa bater exatamente com isso (spring.application.name fica em
# portugues por consistencia com o resto do projeto/logs).
eureka.instance.appname=PRODUCT-SERVICE